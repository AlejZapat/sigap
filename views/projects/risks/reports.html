<z-grid>
    <grid-item class="col-12">
        <z-grid>
            <grid-item class="col-12">
                <z-card>
                    <card-title aria-label="title">
                        <h6 class="m-0">Distribución de costo</h6>
                    </card-title>
                    <card-content id="treemap" style="min-height: 323px;">
                        
                    </card-content>
                </z-card>
            </grid-item>
            <grid-item class="col-6 col-lg-12">
                <z-card>
                    <card-title aria-label="title">
                        <h6 class="m-0">Gráfica C</h6>
                    </card-title>
                    <card-content id="chart-c" style="min-height: 323px;">
                        
                    </card-content>
                </z-card>
            </grid-item>
            <grid-item class="col-6 col-lg-12">
                <z-card>
                    <card-title aria-label="title">
                        <h6 class="m-0">Riesgos por categoría</h6>
                    </card-title>
                    <card-content id="donut" style="min-height: 323px;">
                        
                    </card-content>
                </z-card>
            </grid-item>
        </z-grid>
    </grid-item>
</z-grid>

<script>
    (async function() {
        const project = JSON.parse(sessionStorage.getItem('project'));

        try {
            const db = window.app?.db;

            const risks = await db.getByIndex('p_risks', { key: 'projectId', value: project.id });

            const categoriesMap = Object.fromEntries(
                (await db.getAll('z-app_risk_categories')).map(c => [c.id, c.name])
            );

            const residualFinancialSeverityData = risks.map(risk => ({
                x: risk.code, // código del riesgo
                y: risk.residualFinancialSeverity, // severidad financiera residual
                customData: {
                    description: risk.event.length > 64 ? `${risk.event.slice(0, 64)}...` : risk.event
                }
            }));

            const categoryCount = risks.reduce((acc, risk) => {
                const label = categoriesMap[risk.categoryId] ?? 'Sin categoría';

                if (!acc[label]) acc[label] = 0;
                acc[label]++;

                return acc;
            }, {});

            const render = new window.app.Charts({});
            render.chart('treemap', '#treemap', {
                series: [
                    {
                        data: residualFinancialSeverityData
                    }
                ],
                tooltip: {
                    custom: ({ seriesIndex, dataPointIndex, w }) => {
                        const point = w.config.series[seriesIndex].data[dataPointIndex];

                        return `
                            <div class="apexcharts-tooltip-title" style="font-size: 12px; background-color: rgba(0, 0, 0, 0.05);">
                                ${point.customData.description}
                            </div>
                            <div class="apexcharts-tooltip-content" style="margin-top:0; padding: 12px; font-size: 12px;" >
                                ${point.x}: <strong>${window.formatNumber(point.y)} ${project.currencyCode}</strong> 
                            </div>
                        `;
                    }
                }
            });
            render.chart('donut', '#donut', {
                series: Object.values(categoryCount),
                labels: Object.keys(categoryCount)
            });

        } catch (error) {
            console.error(error);
        }
    })();
</script>
