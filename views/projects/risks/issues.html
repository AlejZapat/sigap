<z-container>
    <z-actionbar>
        <actionbar-item>
            <input aria-label="search" placeholder="Buscar" type="search">
            <span aria-label="results"></span>
        </actionbar-item>
        <actionbar-item>
            <button class="borderless" type="button" aria-label="new" data-icon="add" data-modal-target="new-issue">Agregar</button>
        </actionbar-item>
    </z-actionbar>

    <table class="table-sticky">
        <thead>
            <tr>
                <th width="72">Código</th>
                <th width="128">Categoría</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th width="128">Prioridad</th>
                <th width="128">Estado</th>
                <th width="108">Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <dialog data-id="new-issue">
        <button aria-label="close"></button>
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-refresh="true">
            <panel-head>
                <panel-title>
                    Nuevo Incidente
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Crear</button>
            </panel-foot>
        </form>
    </dialog>

    <z-drawer data-id="edit-issue" aria-orientation="right">
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-auth="1">
            <panel-head>
                <panel-title>
                    Editar Incidente
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Actualizar</button>
            </panel-foot>
        </form>
    </z-drawer>

</z-container>

<script>
    (async function() {
        const project = JSON.parse(sessionStorage.getItem('project'));
        const zContainer = document.querySelector('z-container');
        const zModalBody = zContainer.querySelector('dialog[data-id="new-issue"] panel-body');
        const zDrawerBody = zContainer.querySelector('z-drawer[data-id="edit-issue"] panel-body');

        try {
            const db = window.app?.db;

            const prioritiesMap = Object.fromEntries(
                (await db.getAll('z-system_priorities')).map(r => [r.id, `<z-badge data-type="${r.badge}">${r.name}</z-badge>`])
            );

            const categoriesMap = Object.fromEntries(
                (await db.getAll('z-app_risk_categories')).map(r => [r.id, r.name])
            );

            const statusMap = Object.fromEntries(
                (await db.getAll('z-system_issue_status')).map(r => [r.id, `<z-badge data-type="${r.badge}">${r.name}</z-badge>`])
            );

            const tableName = 'p_issues';
            const fields = ['code', 'categoryId', 'name', 'description', 'priorityId', 'statusId'];

            const issues = await db.getByIndex(tableName, { key: 'projectId', value: project.id });

            await window.app.CRUD.read(zContainer, {
                dataset: { 
                    table: tableName,
                    show: fields.join(',')
                },
                fields: fields,
                data: issues,
                mappers: {
                    categoryId: categoriesMap,
                    priorityId: prioritiesMap,
                    statusId: statusMap
                },
                actions: {
                    create: { auth: 1 },
                    edit: { auth: 1, target: 'edit-issue' },
                    delete: { auth: 1 }
                },
                onCreate: async (form, recordData) => {
                    recordData.projectId = project.id;  
                    recordData.statusId = 1;  
                }
            });

            const formCommon = [
                `<form-group>
                    <label>Código</label>
                    <input name="code" type="text" value="${setCode('I-', issues.length + 1)}" maxlength="8" style="width: 8rem;" readonly>
                </form-group>`,
                `<form-group>
                    <label>Categoría</label>
                    <select name="categoryId" required>
                        ${window.buildOptions(categoriesMap, {emptyOption: true})}
                    </select>
                </form-group>`,
                `<form-group>
                    <label>Nombre</label>
                    <input name="name" type="text" required>
                </form-group>`,
                `<form-group>
                    <label>Descripción</label>
                    <textarea name="description" rows="5"></textarea>
                </form-group>`,
                `<form-group>
                    <label>Prioridad</label>
                    <select name="priorityId" required>
                        ${window.buildOptions(prioritiesMap, {default: 2})}
                    </select>
                </form-group>`
            ];

            const formUpdate = [
                `<form-group>
                    <label>Estado</label>
                    <select name="statusId">
                        ${window.buildOptions(statusMap)}
                    </select>
                </form-group>`                
            ];

            zModalBody.innerHTML = formCommon.join('');
            zDrawerBody.innerHTML = [...formCommon, ...formUpdate].join('');
        } catch (error) {
            console.error(error);
        }
    })();
</script>
