<z-container>
    <z-actionbar>
        <actionbar-item>
            <input aria-label="search" placeholder="Buscar" type="search">
            <span aria-label="results"></span>
        </actionbar-item>
        <actionbar-item>
            <button class="borderless" type="button" aria-label="new" data-icon="add" data-modal-target="new-requirement">Agregar</button>
        </actionbar-item>
    </z-actionbar>

    <table class="table-sticky">
        <thead>
            <tr>
                <th width="72">Código</th>
                <th width="104">Tipo</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th width="128">Estado</th>
                <th width="108">Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <dialog data-id="new-requirement">
        <button aria-label="close"></button>
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-refresh="true">
            <panel-head>
                <panel-title>
                    Nuevo Requisito
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Crear</button>
            </panel-foot>
        </form>
    </dialog>

    <z-drawer data-id="edit-requirement" aria-orientation="right">
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-auth="1">
            <panel-head>
                <panel-title>
                    Editar Requisito
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Actualizar</button>
            </panel-foot>
        </form>
    </z-drawer>

</z-container>

<script>
    (async function() {
        const project = JSON.parse(sessionStorage.getItem('project'));
        const zContainer = document.querySelector('z-container');
        const zModalBody = zContainer.querySelector('dialog[data-id="new-requirement"] panel-body');
        const zDrawerBody = zContainer.querySelector('z-drawer[data-id="edit-requirement"] panel-body');

        const acceptanceCriteria = [
            {
                categoryId: 1,
                name: "Cumplimiento del cronograma",
                description: "Las actividades del proyecto deben ejecutarse conforme al cronograma aprobado.",
                verificationId: 3
            },
            {
                categoryId: 1,
                name: "Cumplimiento del presupuesto",
                description: "Los costos del proyecto deben mantenerse dentro de la línea base aprobada.",
                verificationId: 3
            },
            {
                categoryId: 1,
                name: "Gestión de riesgos",
                description: "Los riesgos críticos deben contar con planes de mitigación implementados.",
                verificationId: 3
            },
            {
                categoryId: 2,
                name: "Estudios topográficos",
                description: "Los estudios topográficos deben realizar el levantamiento de todas las instalaciones existentes en el sitio.",
                verificationId: 3
            },
            {
                categoryId: 2,
                name: "Estudios electromecánicos",
                description: "Los estudios electromecánicos deben demostrar que las instalaciones cumplen con los requerimientos generales de voltaje, corriente, potencia, etc.",
                verificationId: 3
            },
            {
                categoryId: 2,
                name: "Estudios civiles y estructurales",
                description: "Los soportes deben cumplir con los criterios de diseño estructural y cargas de establecidos. Las funcaciones deben cumplir con las condiciones de cargabilidad indicadas en la Legislación.",
                verificationId: 3
            },
            {
                categoryId: 2,
                name: "Estudios del sistema de control y protecciones",
                description: "Los estudios deben garantizar selectividad y coordinación adecuada del sistema.",
                verificationId: 3
            },
            {
                categoryId: 2,
                name: "Estudios del sistema de comunicaciones",
                description: "Los estudios deben demostrar que los equipos de comunicaciones cumplen con los requerimientos de transmisión de datos y latencias.",
                verificationId: 3
            },
            {
                categoryId: 2,
                name: "Estudios eléctricos",
                description: "Los estudios eléctricos (cortocircuito, etc.) deben verificar que los equipos soportan los niveles máximos de falla.",
                verificationId: 3
            },
            {
                categoryId: 3,
                name: "Documentación del proveedor",
                description: "El proveedor debe entregar la documentación administrativa y técnica completa, incluyendo los certificados de calidad.",
                verificationId: 2
            },
            {
                categoryId: 3,
                name: "Prueba de aceptación en fábrica",
                description: "Los equipos deben aprobar las pruebas de aceptación en fábrica según la especificación técnica.",
                verificationId: 1
            },
            {
                categoryId: 3,
                name: "Entrega de equipos",
                description: "Los equipos deben ser entregados conforme al cronograma contractual.",
                verificationId: 2
            },
            {
                categoryId: 4,
                name: "Inspección de fundaciones",
                description: "Las fundaciones de soportes deben construirse de acuerdo con los planos aprobados.",
                verificationId: 2
            },
            {
                categoryId: 4,
                name: "Inspección de montaje mecánico",
                description: "El montaje de soportes y equipos debe cumplir con planos estructurales y especificaciones.",
                verificationId: 2
            },
            {
                categoryId: 4,
                name: "Inspección de meontaje eléctrico",
                description: "El tendido de cables y conexiones debe cumplir con los valores especificados.",
                verificationId: 2
            },
            {
                categoryId: 5,
                name: "Prueba de aceptación en sitio",
                description: "Los equipos deben aprobar las pruebas de aceptación en sitio antes de la energización.",
                verificationId: 1
            },
            {
                categoryId: 5,
                name: "Energización del sistema",
                description: "El sistema de transmisión debe energizarse correctamente sin condiciones anormales.",
                verificationId: 1
            },
            {
                categoryId: 6,
                name: "Disponibilidad del sistema",
                description: "El sistema de transmisión debe cumplir con el nivel mínimo de disponibilidad anual.",
                verificationId: 3
            },
            {
                categoryId: 7,
                name: "Inspección periódica del sistema",
                description: "El sistema de transmisión deben inspeccionarse periódicamente según el plan de mantenimiento.",
                verificationId: 2
            }
        ];

        try {
            const db = window.app?.db;

            const typesMap = Object.fromEntries(
                (await db.getAll('z-system_requirement_types')).map(r => [r.id, r.name])
            );

            const prioritiesMap = Object.fromEntries(
                (await db.getAll('z-system_priorities')).map(r => [r.id, `<z-badge data-type="${r.badge}">${r.name}</z-badge>`])
            );

            const statusMap = Object.fromEntries(
                (await db.getAll('z-system_requirement_status')).map(r => [r.id, `<z-badge data-type="${r.badge}">${r.name}</z-badge>`])
            );

            const tableName = 'p_requirements';
            const fields = ['code', 'typeId', 'name', 'description', 'statusId'];

            const requirements = await db.getByIndex(tableName, { key: 'projectId', value: project.id });

            await window.app.CRUD.read(zContainer, {
                dataset: { 
                    table: tableName,
                    show: fields.join(','),
                },
                fields: fields,
                data: requirements,
                mappers: {
                    typeId: typesMap,
                    statusId: statusMap
                },
                formatters: {
                    contact: {
                        style: 'white-space: pre-line'
                    }
                },
                actions: {
                    create: { auth: 1 },
                    edit: { auth: 1, target: 'edit-requirement' },
                    delete: { auth: 1 }
                },
                onCreate: async (form, recordData) => {
                    recordData.projectId = project.id;
                    recordData.priorityId = 2;
                    recordData.statusId = 1;
                }
            });

            const formCommon = [
                `<form-group>
                    <label>Código</label>
                    <input name="code" type="text" value="${setCode('RQ-', requirements.length + 1)}" maxlength="8" style="width: 8rem;" readonly>
                </form-group>`,
                `<form-group>
                    <label>Tipo</label>
                    <select name="typeId" required>
                        ${window.buildOptions(typesMap, {emptyOption: true})}
                    </select>
                </form-group>`,
                `<form-group>
                    <label>Nombre</label>
                    <input name="name" type="text" required>
                </form-group>`,
                `<form-group>
                    <label>Descripción</label>
                    <textarea name="description" rows="5" required></textarea>
                </form-group>`,
                `<form-group>
                    <label>Fundamento</label>
                    <textarea name="rationale" rows="5" required></textarea>
                </form-group>`
            ];

            const formUpdate = [
                `<form-group>
                    <label>Prioridad</label>
                    <select name="priorityId">
                        ${window.buildOptions(prioritiesMap, {default: 2})}
                    </select>
                </form-group>`,
                `<form-group>
                    <label>Estado</label>
                    <select name="statusId">
                        ${window.buildOptions(statusMap)}
                    </select>
                </form-group>`
            ];

            zModalBody.innerHTML = formCommon.join('');
            
            zDrawerBody.innerHTML = `
                <fieldset>
                    <legend>Identificación</legend>
                    ${[...formCommon, ...formUpdate].join('')}
                </fieldset>
                <fieldset>
                    <legend>Criterios de aceptación</legend>
                    
                </fieldset>
            `;
        } catch (error) {
            console.error(error);
        }
    })();
</script>

<!-- 
Store que contiene los criterios de aceptación:
{
    id: number,                 // Identificador único interno
    requirementId: number,      // Identificador único del requisito
    categoryId: number,         // 1: management | 2: engineering | 3: procurement | 4: construction | 5: commissioning | 6: operation | 7: maintenance
    code: string,               // Código
    name: string,               // Nombre del criterio
    description: string,        // Descripción del criterio verificable
    verificationId: number,     // 1: test | 2: inspection | 3: analysis | 4: demonstration
    statusId: number            // 1: pending | 2: passed | 3: failed
}

-->
