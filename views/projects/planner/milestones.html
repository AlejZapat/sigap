<z-container>
    <z-actionbar>
        <actionbar-item>
            <input aria-label="search" placeholder="Buscar" type="search">
            <span aria-label="results"></span>
        </actionbar-item>
        <actionbar-item>
            <button class="borderless" type="button" aria-label="new" data-icon="add" data-modal-target="new-milestone">Agregar</button>
        </actionbar-item>
    </z-actionbar>

    <table class="table-sticky">
        <thead>
            <tr>
                <th width="72">Código</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th width="128">Estado</th>
                <th width="108">Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <dialog data-id="new-milestone">
        <button aria-label="close"></button>
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-refresh="true">
            <panel-head>
                <panel-title>
                    Nuevo Hito
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Crear</button>
            </panel-foot>
        </form>
    </dialog>

    <z-drawer data-id="edit-milestone" aria-orientation="right">
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-auth="1">
            <panel-head>
                <panel-title>
                    Editar Hito
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Actualizar</button>
            </panel-foot>
        </form>
    </z-drawer>
</z-container>

<script>
    (async function() {
        const project = JSON.parse(sessionStorage.getItem('project'));
        const zContainer = document.querySelector('z-container');
        const zModalBody = zContainer.querySelector('dialog[data-id="new-milestone"] panel-body');
        const zDrawerBody = zContainer.querySelector('z-drawer[data-id="edit-milestone"] panel-body');

        try {
            const db = window.app?.db;

            const statusMap = Object.fromEntries(
                (await db.getAll('z-system_milestone_status')).map(r => [r.id, `<z-badge data-type="${r.badge}">${r.name}</z-badge>`])
            );

            const tableName = 'p_milestones';
            const fields = ['code', 'name', 'description', 'statusId'];

            const milestones = await db.getByIndex(tableName, { key: 'projectId', value: project.id });

            await window.app.CRUD.read(zContainer, {
                dataset: { 
                    table: tableName,
                    show: fields.join(',')
                },
                fields: fields,
                data: milestones,
                mappers: {
                    statusId: statusMap
                },
                formatters: {
                    description: {
                        style: 'white-space: pre-line'
                    }
                },
                actions: {
                    create: { auth: 1 },
                    edit: { auth: 1, target: 'edit-milestone' },
                    delete: { auth: 1 }
                },
                onCreate: async (form, recordData) => {
                    recordData.projectId = project.id;
                    recordData.statusId = 1;
                    
                    // Construir el primer objeto de history con valores automáticos
                    recordData.history = [{
                        date: window.formatDateToISO(project.startDate, 12),
                        dueDate: window.formatDateToISO(recordData.dueDate, 12),
                        grounds: 'Fecha inicial'
                    }];
                    
                    // Eliminar dueDate del nivel superior (ya está en history)
                    delete recordData.dueDate;
                    
                    // doneDate se agrega cuando el hito se complete
                    recordData.doneDate = null;
                }
            });

            const formCommon = [
                `<form-group>
                    <label>Código</label>
                    <input name="code" type="text" value="${setCode('M-', milestones.length + 1)}" maxlength="8" style="width: 8rem;" readonly>
                </form-group>`,
                `<form-group>
                    <label>Nombre</label>
                    <input name="name" type="text" maxlength="64">
                </form-group>`,
                `<form-group>
                    <label>Descripción</label>
                    <textarea name="description" rows="5"required></textarea>
                </form-group>`
            ];

            const formHistory = [
                `<form-group>
                    <label>Vencimiento</label>
                    <input 
                        name="dueDate" 
                        type="date" 
                        min="${window.formatDate(project.startDate, window.app.DATE_ISO_CFG)}" 
                        max="${window.formatDate(project.finishDate, window.app.DATE_ISO_CFG)}" 
                    required>
                </form-group>`,
            ];

            const formUpdate = [
                `<form-group>
                    <label>Fecha Cumplimiento</label>
                    <input name="doneDate" type="date" disabled>
                </form-group>`,
                `<form-group>
                    <label>Estado</label>
                    <select name="statusId">
                        ${window.buildOptions(statusMap)}
                    </select>
                </form-group>`
            ];

            zModalBody.innerHTML = [...formCommon, ...formHistory].join('');
            zDrawerBody.innerHTML = `<z-tab>
                <tab-head>
                    <tab-head-item role="link" href="#general">General</tab-head-item>
                    <tab-head-item role="link" href="#history">Historial</tab-head-item>
                </tab-head>
                <tab-body>
                    <tab-body-item id="general">
                        ${[...formCommon, ...formUpdate].join('')}
                    </tab-body-item>
                    <tab-body-item id="history">
                        <z-actionbar class="px-0">
                            <actionbar-item>
                                <button type="button" class="borderless" data-icon="add_circle" id="btn-add-record">Agregar</button>
                            </actionbar-item>
                            <actionbar-item>
                                <button type="button" class="borderless" data-icon="check_circle" id="btn-accept-edit">Aceptar</button>
                                <button type="button" class="borderless" data-icon="cancel" id="btn-cancel-edit">Cancelar</button>
                            </actionbar-item>
                        </z-actionbar>
                        <table class="table-sticky">
                            <thead>
                                <tr>
                                    <th width="128">Registro</th>
                                    <th width="128">Vencimiento</th>
                                    <th>Fundamentos</th>
                                    <th width="88"></th>
                                </tr>
                            </thead>
                            <tbody id="records-list"></tbody>
                        </table>
                        <input type="hidden" name="history" data-saveas="object" value="">
                        <z-alert class="my-md" data-type="warning" data-icon="true">
                            <alert-content>
                                <alert-head>Atención!</alert-head>
                                <alert-body>
                                    Recuerde <strong>Actualizar</strong> después de agragar, modificar o borrar algún registro.
                                </alert-body>
                            </alert-content>
                        </z-alert>
                    </tab-body-item>
                </tab-body>
            </z-tab>`;
            
            // Variable para mantener la instancia de ArrayManager
            let recordsManager = null;
            
            // Listener para cargar el historial cuando se abre el drawer
            zContainer.addEventListener('crud:update:load:complete', (event) => {
                const { record } = event.detail;
                
                // Destruir instancia anterior si existe
                if (recordsManager) {
                    recordsManager.destroy();
                    recordsManager = null;
                }
                
                // Crear nueva instancia cada vez
                recordsManager = new window.app.ArrayManager({
                    fieldName: 'history',
                    fields: [
                        {
                            name: 'date',
                            type: 'date',
                            required: true,
                            defaultValue: () => new Date()
                        },
                        {
                            name: 'dueDate',
                            type: 'date',
                            required: true
                        },
                        {
                            name: 'grounds',
                            type: 'text',
                            required: true
                        }
                    ],
                    formatters: {
                        date: (value) => window.formatDate(value, window.app.DATE_LOCALE_CFG),
                        dueDate: (value) => window.formatDate(value, window.app.DATE_LOCALE_CFG)
                    },
                    transformers: {
                        date: (value) => window.formatDateToISO(value, 12),
                        dueDate: (value) => window.formatDateToISO(value, 12)
                    }
                });
                
                // Inicializar con los datos del registro
                recordsManager.init(record.history || []);
            });
        } catch (error) {
            console.error(error);
        }
    })();
</script>
