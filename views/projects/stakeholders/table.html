<z-container>
    <z-actionbar>
        <actionbar-item>
            <input aria-label="search" placeholder="Buscar" type="search">
            <span aria-label="results"></span>
        </actionbar-item>
        <actionbar-item>
            <button class="borderless" type="button" aria-label="new" data-icon="add" data-modal-target="new-stakeholder">Agregar</button>
        </actionbar-item>
    </z-actionbar>

    <table class="table-sticky">
        <thead>
            <tr>
                <th width="72">Código</th>
                <th>Nombre</th>
                <th>Contacto</th>
                <th width="128">Poder</th>
                <th width="128">Interés</th>
                <th width="128">Estado</th>
                <th width="108">Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <dialog data-id="new-stakeholder" style="height: 620px;">
        <button aria-label="close"></button>
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-refresh="true">
            <panel-head>
                <panel-title>
                    Nuevo Interesado
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Crear</button>
            </panel-foot>
        </form>
    </dialog>

    <z-drawer data-id="edit-stakeholder" aria-orientation="right">
        <form method="post" autocomplete="off" role="form" enctype="multipart/form-data" data-auth="1">
            <panel-head>
                <panel-title>
                    Editar Interesado
                </panel-title>
            </panel-head>
            <panel-body></panel-body>
            <panel-foot>
                <button type="submit">Actualizar</button>
            </panel-foot>
        </form>
    </z-drawer>

</z-container>

<script>
    (async function() {
        const project = JSON.parse(sessionStorage.getItem('project'));
        const zContainer = document.querySelector('z-container');
        const zModalBody = zContainer.querySelector('dialog[data-id="new-stakeholder"] panel-body');
        const zDrawerBody = zContainer.querySelector('z-drawer[data-id="edit-stakeholder"] panel-body');

        try {
            const db = window.app?.db;

            const typesMap = Object.fromEntries(
                (await db.getAll('z-system_stakeholder_types')).map(r => [r.id, r.name])
            );

            const roles = await db.getAll('z-system_stakeholder_roles');

            const attitudesMap = Object.fromEntries(
                (await db.getAll('z-system_stakeholder_attitudes')).map(r => [r.id, r.name])
            );

            const powersMap = Object.fromEntries(
                (await db.getAll('z-system_stakeholder_powers')).map(r => [r.id, r.name])
            );

            const interestsMap = Object.fromEntries(
                (await db.getAll('z-system_stakeholder_interests')).map(r => [r.id, r.name])
            );
            
            const prioritiesMap = Object.fromEntries(
                (await db.getAll('z-system_priorities')).map(r => [r.id, r.name])
            );
            const statusMap = Object.fromEntries(
                (await db.getAll('z-system_stakeholder_status')).map(r => [r.id, `<z-badge data-type="${r.badge}">${r.name}</z-badge>`])
            );

            const tableName = 'p_stakeholders';
            const fields = ['code', 'name', 'contact', 'powerId', 'interestId', 'statusId'];

            const stakeholders = await db.getByIndex(tableName, { key: 'projectId', value: project.id });

            await window.app.CRUD.read(zContainer, {
                dataset: { 
                    table: tableName,
                    show: fields.join(',')
                },
                fields: fields,
                data: stakeholders,
                mappers: {
                    powerId: powersMap,
                    interestId: interestsMap,
                    statusId: statusMap
                },
                formatters: {
                    contact: {
                        style: 'white-space: pre-line'
                    }
                },
                actions: {
                    create: { auth: 1 },
                    edit: { auth: 1, target: 'edit-stakeholder' },
                    delete: { auth: 1 }
                },
                onCreate: async (form, recordData) => {
                    recordData.projectId = project.id;
                    recordData.priorityId = 2;
                    recordData.statusId = 1;
                },
                onLoad: (form, record) => {
                    setupStakeholderListeners(form, roles, record.roleId);
                }
            });

            /**
             * Configura el listener de typeId para filtrar los roles disponibles en roleId
             * @param {HTMLElement} container - Contenedor del formulario (modal o drawer)
             * @param {Array} roles - Array completo de roles con su typeId asociado
             * @param {number|null} [savedRoleId=null] - Valor de roleId a restaurar tras reconstruir opciones (para edición)
             */
            function setupStakeholderListeners(container, roles, savedRoleId = null) {
                const typeSelect = container.querySelector('select[name="typeId"]');
                const roleSelect = container.querySelector('select[name="roleId"]');

                if (typeSelect && roleSelect) {
                    window.selectConditionalListener(typeSelect, (value) => {
                        const filtered = roles.filter(r => r.typeId == value);
                        roleSelect.innerHTML = filtered
                            .map(r => `<option value="${r.id}">${r.name}</option>`)
                            .join('');

                        if (savedRoleId) {
                            roleSelect.value = savedRoleId;
                            savedRoleId = null;
                        }
                    });
                }
            }

            const formCommon = {
                'general': [
                    `<form-group>
                        <label>Código</label>
                        <input name="code" type="text" value="${setCode('S-', stakeholders.length + 1)}" maxlength="8" style="width: 8rem;" readonly>
                    </form-group>`,
                    `<form-group>
                        <label>Clasificación</label>
                        <group-set>
                            <group-item>
                                <label>Tipo</label>
                                <select name="typeId">
                                    ${window.buildOptions(typesMap, {default: 1})}
                                </select>
                            </group-item>
                            <group-item>
                                <label>Rol</label>
                                <select name="roleId" required></select>
                            </group-item>
                        </group-set>
                    </form-group>`,
                    `<form-group>
                        <label>Nombre</label>
                        <input type="text" name="name" required>
                    </form-group>`,
                    `<form-group>
                        <label>Contacto</label>
                        <textarea name="contact" rows="3" required></textarea>
                    </form-group>`,
                    `<form-group>
                        <label>Expectativa</label>
                        <textarea name="expectation" rows="3" required></textarea>
                    </form-group>`
                ],
                'assessment': [
                    `<form-group>
                        <label>Actitud hacia el proyecto</label>
                        <select name="attitudeId">
                            ${window.buildOptions(attitudesMap, {default: 2})}
                        </select>
                    </form-group>`,
                    `<form-group>
                        <label>Poder sobre el proyecto</label>
                        <select name="powerId">
                            ${window.buildOptions(powersMap, {default: 3})}
                        </select>
                    </form-group>`,
                    `<form-group>
                        <label>Interés en el proyecto</label>
                        <select name="interestId">
                            ${window.buildOptions(interestsMap, {default: 3})}
                        </select>                     
                    </form-group>`,
                    `<form-group>
                        <label>Afectación del proyecto sobre el interesado</label>
                        <textarea name="affectation" rows="3" required></textarea>
                    </form-group>`
                ]
            };

            const formUpdate = {
                'general': [
                    `<form-group>
                        <label>Prioridad</label>
                        <select name="priorityId">
                            ${window.buildOptions(prioritiesMap)}
                        </select>         
                    </form-group>`,
                    `<form-group>
                        <label>Estado</label>
                        <select name="statusId">
                            ${window.buildOptions(statusMap)}
                        </select>
                    </form-group>`
                ],
                'assessment': [
                    `<form-group>
                        <label>Acciones sobre el interesado</label>
                        <textarea name="actions" rows="3" required></textarea>
                    </form-group>`
                ]
            };

            zModalBody.innerHTML = `<z-tab>
                <tab-head>
                    <tab-head-item role="link" href="#n-general">General</tab-head-item>
                    <tab-head-item role="link" href="#n-assessment">Valoración</tab-head-item>
                </tab-head>
                <tab-body>
                    <tab-body-item id="n-general">
                        ${formCommon['general'].join('')}
                    </tab-body-item>
                    <tab-body-item id="n-assessment">
                        ${formCommon['assessment'].join('')}
                    </tab-body-item>
                </tab-body>
            </z-tab>`;

            setupStakeholderListeners(zModalBody, roles);

            zDrawerBody.innerHTML = `<z-tab>
                <tab-head>
                    <tab-head-item role="link" href="#e-general">General</tab-head-item>
                    <tab-head-item role="link" href="#e-assessment">Valoración</tab-head-item>
                </tab-head>
                <tab-body>
                    <tab-body-item id="e-general">
                        ${[...formCommon['general'], ...formUpdate['general']].join('')}
                    </tab-body-item>
                    <tab-body-item id="e-assessment">
                        ${[...formCommon['assessment'], ...formUpdate['assessment']].join('')}
                    </tab-body-item>
                </tab-body>
            </z-tab>`;
        } catch (error) {
            console.error(error);
        }
    })();
</script>
